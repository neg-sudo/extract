name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: Byte-compile
        run: python -m compileall -q lib tests scripts
      - name: Ruff critical checks
        run: ruff check lib tests --select E9,F63,F7,F82
      - name: Ruff full report (informational)
        run: ruff check lib tests || true
      - name: Shell syntax
        run: bash -n scripts/install.sh
