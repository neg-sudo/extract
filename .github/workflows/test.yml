name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show environment
        run: python -VV
      - name: Compile
        run: python -m compileall -q lib
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python lib/extract.py --version
          python lib/extract.py --verify-install
