name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   name: linux-amd64,   py: "3.12" }
          - { os: ubuntu-24.04-arm, name: linux-arm64,  py: "3.12" }
          - { os: macos-13,        name: darwin-amd64,  py: "3.12" }
          - { os: macos-14,        name: darwin-arm64,  py: "3.12" }
          - { os: windows-latest,  name: windows-amd64, py: "3.12" }
          - { os: windows-11-arm,  name: windows-arm64, py: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build one-file binary
        run: pyinstaller --clean --noconfirm --onefile --name extract --paths lib lib/extract.py
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          cp dist/extract "out/extract-${{ matrix.name }}"
          cd out && zip -9 "extract-${{ matrix.name }}.zip" "extract-${{ matrix.name }}"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/extract.exe "out/extract-${{ matrix.name }}.exe"
          Compress-Archive -Path "out/extract-${{ matrix.name }}.exe" -DestinationPath "out/extract-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*.zip

  zipapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build universal zipapp
        run: |
          find lib -name __pycache__ -type d -prune -exec rm -rf {} +
          mkdir -p out
          python -m zipapp lib -m "extract:main" --compress -p "/usr/bin/env python3" -o out/extract.pyz
          chmod +x out/extract.pyz
      - uses: actions/upload-artifact@v7
        with:
          name: zipapp
          path: out/extract.pyz

  release:
    needs: [binaries, zipapp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.pyz' \) -exec cp {} release/ \;
          cd release
          python - <<'PY'
          import hashlib, pathlib
          lines = []
          for p in sorted(pathlib.Path('.').iterdir()):
              if p.is_file() and p.name != 'SHA256SUMS':
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  lines.append(f"{h}  {p.name}")
          pathlib.Path('SHA256SUMS').write_text("\n".join(lines) + "\n")
          print(pathlib.Path('SHA256SUMS').read_text())
          PY
      - name: Sign checksums (GPG, optional)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --detach-sign --armor release/SHA256SUMS
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Sign checksums (cosign keyless, optional)
        continue-on-error: true
        run: |
          cosign sign-blob --yes --output-signature release/SHA256SUMS.sig \
            --output-certificate release/SHA256SUMS.pem release/SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
